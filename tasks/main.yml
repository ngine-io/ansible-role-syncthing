---
- name: Install HTTPS transport for apt
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
  when: syncthing__apt_repository_url.startswith('https')
  register: result
  until: result is succeeded
  retries: 5
  delay: 2

- name: Get DEB architecture
  ansible.builtin.command: dpkg --print-architecture
  register: deb_architecture

- name: Clean up old syncthing repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/syncthing.list
    state: absent

- name: Add syncthing repository
  ansible.builtin.deb822_repository:
    name: syncthing
    types: deb
    install_python_debian: true
    uris: '{{ syncthing__apt_repository_url }}'
    suites: syncthing
    components: stable
    architectures: '{{ deb_architecture.stdout }}'
    signed_by: https://syncthing.net/release-key.txt

- name: Install syncthing
  ansible.builtin.apt:
    name: "{{ syncthing__package + '=' + syncthing__version if syncthing__version else syncthing__package }}"
  register: result
  until: result is succeeded
  retries: 5
  delay: 2

- name: Create syncthing service unit file
  ansible.builtin.template:
    src: syncthing.service.j2
    dest: /etc/systemd/system/syncthing.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart syncthing

- name: Create syncthing home
  ansible.builtin.file:
    path: "{{ syncthing__home_path }}"
    owner: "{{ syncthing__user }}"
    group: "{{ syncthing__group }}"
    state: directory
    mode: "0700"
  notify: Restart syncthing

- name: Start and enable syncthing
  ansible.builtin.systemd:
    name: syncthing.service
    state: started
    daemon_reload: true
    enabled: true

- name: Flush Handlers
  ansible.builtin.meta: flush_handlers

- name: Verify syncthing is running
  ansible.builtin.wait_for:
    port: "{{ syncthing__wait_for_port }}"
